ter": "111-2", "source": "111-2!第2列", "note": "", "time_span": "14:00-16:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "中正大學中文系王瓊玲\n進修網師資（同課程）：[大學教授]中正大學中文系／作家王瓊玲", "web_status": "3747781：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3747781", "endDate": "2023-03-06", "notes": "", "intro": "跨校社群：歷史、文學與創作\n那些被遺忘的故事，那些被留下來的女人。\n女性角色在時代的悲歌中，留下多麼堅毅溫柔的身影。我們很榮幸，能邀請中正大學中文系的王瓊玲老師與我們分享「歷史、文學與創作」的關係。瓊玲老師的學術專長是古典小說、現代文藝、文學理論與批評、史傳文學，長年是國光劇團許多重要劇本的原著，同時也是台灣圖書館首位駐館作家，近年投入在記錄823砲戰遺孀的故事，留下這些可歌可泣的時代樣貌，相當動人。\n一九五八年爆發八二三臺海戰役，當丈夫用生命來捍衛臺灣；遺孀用一生的青春來見證愛情、護守家園。\n六十多年前，她們一個個也才二十歲左右，\n哪一個不是風華正盛？哪一個不是玉貌綺年？\n然而，命運硬生生掐死了青春、砲火轟隆隆把她們炸成了寡婦。\n近兩百位無辜的女子，也全嘩啦啦的掉進了煉獄，\n承受了人世間的千瘡百孔。\n這段動人的故事，在課程連結上，寫作取材可以和小畢的故事、礦村行、隔閡等一起觀看，瓊玲老師以深度訪談的方式留下時代被忽略的聲音，形成人文關懷意識。主題發展上，舉凡和平、戰爭與族群的文章，也可連結。當然，光聽老師說這些故事，認識女性在戰爭下的遭遇，就已精彩萬分。\n講座主題：歷史、文學與創作\n時間：112年3月6日（一）14:00-16:00\n講師：中正大學中文系／作家王瓊玲\n地點：三民家商圖書館5樓多媒體教室", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-3"}, {"date": "2023-03-13T14:00:00", "type": "教師研習", "time": "112年3月13日（一）14:00-16:00", "title": "心智結構的教學展現", "speaker": "花蓮高中王清平", "place": "圖書館", "people": null, "cid": "3747791", "codes": ["3747791"], "semester": "111-2", "source": "111-2!第3列", "note": "", "time_span": "14:00-16:00", "category": "專題講座", "audience": "教師", "theme": "課程設計與教學實踐", "speaker_full": "花蓮高中王清平\n進修網師資（同課程）：[中小幼師]王清平,[中小幼師]陳瓊玉", "web_status": "3747791：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3747791", "endDate": "2023-03-13", "notes": "", "intro": "跨校社群：心智結構的教學展現＋自我覺察與師生對話\n新課綱推動已逾三年，這學期社群以「素養時代的特色國文教學」，期盼從不同角度觀看北中南東學校頗具特色的國文教學課程風景。在課程觀點中，我們仍期盼有跨域、整合和創新的思考，擬就專題整合、班經融入、書寫表達、思維結構切入，綜觀普高技職、必修校本課程的種種樣貌。藉由親炙課堂的繁花盛景，共創回歸教與學的美好藍圖。\n王清平老師，江湖人稱「花中九把刀」、「瑜珈大師」，著有《改變你對國文的教與學》、《用心智圖讀國文》。清平老師對教學頗有心得，歸納文章「公式」，提出「概念模組」，透過心智圖開展文章核心文義，深獲好評。\n陳瓊玉老師，任教高雄高商國文科。瓊玉老師對自我與學生的觀察十分細膩，多年力求突破自我與學生的限制，深耕於學思達教學，開展各式對話，引發深刻的學習思考。\n時間：112年3月13日（一）14:00-17:00\n地點：三民家商社區圖書館\n［主題講座］心智結構的教學展現\n時間：14:00-16:00\n講師：花蓮高中國文科王清平\n［社群分享］自我覺察與師生對 3-22T13:00:00", "type": "教師研習", "time": "112年3月22日（三）段考日13:00-16:00", "title": "A2:數位工作坊：google平台的進階運用", "speaker": "卓蘭高中賴建宏", "place": "1205電腦教室", "people": 30.0, "cid": "3747830", "codes": ["3747830"], "semester": "111-2", "source": "111-2!第17列", "note": "", "time_span": "13:00-16:00", "category": "實作工作坊", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "卓蘭高中賴建宏\n進修網師資（同課程）：[中小幼師]賴建宏", "web_status": "3747830：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3747830", "endDate": "2023-03-22", "notes": "", "intro": "時間：112年3月22日（三）段考日13:00-16:00\n講師：國立卓蘭高級中等學校 賴建宏 教師\n地點：本校1205電腦教室\n為體驗實作型課程，以google classroom為數位學習平台介紹示例，輔以實際操作練習，體驗了解如何進行學習任務的派送、學習規劃、學習成效報告檢核等功能機制，理解數位學習平台支持適性學習與教學實施，透過支持學生個人差異化學習進度和歷程。\n本次課程稍微進階，將帶領學員三個主題:\n1. Google Workspace平台簡介\n2. Gmail結合Google Sheet合併列印寄送客製化大量信件\n3. Google chrome瀏覽器教學用外掛工具\n4. 其餘學員需求", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-7"}, {"date": "2023-04-14T14:00:00", "type": "教師研習", "time": "112年4月14日（五）14:00-16:00", "title": "輕鬆美編＆教學一把罩：canva", "speaker": "中正高中王清美", "place": "1205電腦教室", "people": 38.0, "cid": "3747846", "codes": ["3747846"], "semester": "111-2", "source": "111-2!第18列", "note": "", "time_span": "14:00-16:00", "category": "實作工作坊", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "中正高中王清美\n進修網師資（同課程）：[中小幼師]王清美", "web_status": "3747846：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3747846", "endDate": "2023-04-14", "notes": "", "intro": "時間：112年4月14日（五） 14:00-16:00\n講師：高雄市中正高中 王清美 教師\n地點：本校1205電腦教室\ncanva是一套強大的線上製圖工作，具備簡單、易學、好操作的特點。可以運用於教學投影片、海報、社群媒體等各式場合。本次課程邀約，老師將由基礎開始帶領學員學習如何操作canva，排版的一些小訣竅，以及如何運用於教學現場。讓你瞬間從初學者，變成簡報製作高手。", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-8"}, {"date": "2023-04-24T14:00:00", "type": "教師研習", "time": "112年4月24日（一）14:00-16:00", "title": "校本實踐的書寫表達", "speaker": "海青工商廖婉利", "place": "圖書館", "people": null, "cid": "3747798", "codes": ["3747798"], "semester": "111-2", "source": "111-2!第5列", "note": "", "time_span": "1 、14:00-16:00", "category": "專題講座", "audience": "其他／待確認", "theme": "課程設計與教學實踐", "speaker_full": "演員、作家宮能安\n進修網師資（同課程）：[社專人士]作家、演員宮能安", "web_status": "3867782：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3867782", "endDate": "2023-05-12", "notes": "", "intro": "2023年宮能安巡演破六百場演出，再度蒞臨三民家商！\n時間：\n2023/5/12 上午10:00-12:00\n2023/5/13 下午14:00-16:00\n地點：2樓小禮堂\n全台超過萬人同聲讚嘆，感動回饋從不間斷\n關於友情、親情、愛情、孤獨、成功、人性和自我\n「原來劇場與生活如此靠近！」\n這是一趟尋找純真自我的旅程\n擁抱哲學與生活碰撞出的種種火花\n這個故事\n不僅獻給孩子，也獻給大人\n一位說書人，帶了一把吉他\n運用光影、聲音、歌曲、物件及戲劇扮演\n透過半演半說半唱的表演形式\n打開《小王子》與現實生活中最直接的對話\n以深入淺出的方式\n用當代臺灣社會種種光景探索《小王子》中的哲學\n人人心中都有一位小王子。\n作者 安托萬・德・聖-修伯里\n法國作家、飛行員，1900年6月29日生於法國里昂。1944年獲得「法蘭西烈士」稱號。在他的經典兒童小說《小王子》出版一年後，為祖國披甲對抗納粹德軍。在1944年7月31日執行一次飛行任務時失蹤。他以於1943年出版的童話《小王子》（Le Petit Prince／The Little Prince）而聞名於世，其他著名的小說分別有《夜航》、《人類的土地》、《空軍飛行員》等。位於其家鄉的里昂聖-修伯里機場是以他命名的。直到2004年4月，離奇失蹤近60年的修伯里飛機殘骸才在法國南部馬賽附近海域被尋獲。在他逝世50周年時，法國人將他與小王子的形象印在50法國法郎的鈔票上。\n編導演 宮能安\n一名演員，創作《地球人遇見小王子》的單人演說劇場，從2016年巡迴至今已逾500多場次，觀賞對象也從國中擴展至高中、大學與社會人士不等，目前足跡遍及臺灣、中國、美國各地。演出音樂劇《今晚，我想來點》《勸世三姊妹》《地球人遇見小王子》等，擁有自己的podcast節目《宮5事3》及Youtube，還寫了一本書《致無法拒絕長大的我們》。", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-15"}, {"date": "2023-05-16T10:00:00", "type": "主題講座與藝文活動", "time": "112年5月16日（二）10:00-12:00", "title": "跨域人生，餐旅職涯分享", "speaker": "1.91一點酒意酒食劇場\n創辦人王品翔", "place": "小禮堂", "people": null, "cid": "3869461", "codes": ["3869461"], "semester": "111-2", "source": "111-2!第25列", "note": "", "time_span": "10:00-12:00", "category": "專題講座", "audience": "其他／待確認", "theme": "專業領域與跨域實務", "speaker_full": "1.91一點酒意酒食劇場\n創辦人王品翔\n進修網師資（同課程）：[社專人士]王品翔", "web_status": "3869461：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3869461", "endDate": "2023-05-16", "notes": "", "intro": "時間：2023年5月16日（二）10:00-12:00\n地點：國際會議廳\n王品翔，一點酒意劇場餐酒館創辦人。高中未畢業便選擇走入職場，曾就讀中山大學戲劇學系。戲劇興趣、餐飲實作、美學體悟......，在不斷嘗試與跨域的過程中，有挫折、有變動、有體悟，逐步建構獨一無二的餐酒館品牌，王品翔將引導大家思索如何運用跨域元素，結合專業發展不一樣的餐飲路，定位品牌獨一無二的樣貌，歡迎來對話和感受。", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-16"}, {"date": "2023-05-22T12:00:00", "type": "走讀與參訪", "time": "112年5月22日（一）\n12:00-19:00", "title": "閱覽風華，走讀旗津", "speaker": "旗津tha̍k冊書店＆文史工作者蕭孟曲", "place": "旗津tha̍k冊書店", "people": null, "cid": "3872971", "codes": ["3872971"], "semester": "111-2", "source": "111-2!第9列", "note": "", "time_span": "12:00-19:00", "category": "走讀參訪與體驗", "audience": "教師", "theme": "環境、藝術與社會情緒學習", "speaker_full": "旗津tha̍k冊書店＆文史工作者蕭孟曲\n進修網師資（同課程）：[社專人士]旗津tha̍k冊書店＆文史工作者蕭孟曲,[中小幼師]三民家商黃一軒,[中小幼師]高餐大附中顧晏瑜", "web_status": "3872971：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3872971", "endDate": "2023-05-22", "notes": "", "intro": "我們續辦走讀研習活動，一起坐船，從鼓山到旗津。\n旗津離市區不遠（捷運西子灣站／輕軌哈瑪星站），老師們實際帶學生走讀是容易的。同時坐船、燈塔、天后宮、砲台、老街、獨立書店等元素交錯運用，能結合所有適切的海洋、旅行與產業發展相關的文本。這些地點都散布在旗津老街一帶，通通走路可到。\n此外，我們這次邀約旗津tha̍k冊的店主人蕭孟曲帶我們走讀。蕭孟曲是咖啡師、文史工作者，更致力於推廣台灣語言，旗津tha̍k冊是旗津第一間（目前也是唯一的）獨立書店。\n旗津發展的開始：近百年前的旗後，是高雄文學發展的起點，漢學、詩社，文人雅士聚集，留下不少優秀的文學作品，這部分，我們也將聽蕭孟曲娓娓道來。此外，獨立書店的建築、空間和理念，是最有趣的地方。時間來不及的話，大家自由來去，許可的話一起留下來在旗津老街吃海鮮。\n時間：2023年5月22日（一）12:30 ~ 19:00\n集合地點：鼓山渡輪站\n12:20 ~ 12:30\n報到\n12:30 ~ 13:30\n旗津走讀國文課程設計：海洋、歷史與文化的對接\n三民家商國文科黃一軒\n13:30~16:30\n旗津的前世今生：地域的開端與發展\n旗津tha̍k冊書店＆文史工作者蕭孟曲\n16:30~16:40\n交流討論\n跨校社群團隊\n16:40~17:40\n旗津的風華再現：獨立書店與在地文化意義\n旗津tha̍k冊書店＆文史工作者蕭孟曲\n17:40~18:40\n走讀經驗分享與課程設計\n高餐大附中國文科顧晏瑜\n18:40~19:00\n綜合討論\n跨校社群團隊", "hours": "6小時/學分", "countLabel": "參與人數", "id": "event-17"}, {"date": "2023-06-09T14:00:00", "type": "教師研習", "time": "112年6月9日（五）14:00-17:00", "title": "ChatGPT萬用大補帖：讓教學，無限可期", "speaker": "翔太創新科技劉于彰", "place": "1205電腦教室", "people": 48.0, "cid": "3880479", "codes": ["3880479"], "semester": "111-2", "source": "111-2!第21列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "翔太創新科技劉于彰\n進修網師資（同課程）：[社專人士]章魚哥AI研究室/翔太創新科技劉于彰", "web_status": "3880479：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=3880479", "endDate": "2023-06-09", "notes": "", "intro": "主題：ChatGPT萬用大補帖：讓教學，無限可期\n講師：章魚哥AI研究室/翔太創新科技劉于彰\n時間：2023.6.9 (五) 14:00-17:0 , "place": "線上", "people": null, "cid": "4087687", "codes": ["4087687"], "semester": "112-1", "source": "112-1!第9列", "note": "", "time_span": "13:00-16:00", "category": "專題講座", "audience": "教師", "theme": "課程設計與教學實踐", "speaker_full": "中華電信學院陳溢源講座\n進修網師資（同課程）：[社專人士]中華電信學院陳益源講座", "web_status": "4087687：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4087687", "endDate": "2023-10-16", "notes": "", "intro": "講題：資訊安全威脅與防護、電子郵件安全與社交工程防範\n講師：中華電信學院陳溢源講座\n時間：112年10月16日（一） 下午13:00-16:00\n地點：線上Google meet（報名後發送連結至信箱）\n研習內容：\n資訊安全威脅與防護\n認識資訊安全威脅與防護，清楚知道社交軟體應用過程會遇到什麼問題、宣導正確的資安觀念及防範對策。本課程將帶您瞭解資訊安全威脅、社交軟體使用過程、資訊安全防範技巧及正確的資安觀念，透過專家的解釋，讓大家習得資訊安全。\n電子郵件安全與社交工程防範\n電子郵件是大多數人日常生活中常用的溝通工具，然而卻有許多資安攻擊或詐騙行為是透過電子郵件來實施。隨著科技的進步，透過電子郵件所實施的攻擊與詐騙手法也與時俱進，因此我們必須瞭解電子郵件常見的安全性問題，認識何謂社交工程術，並透過案例的介紹，帶你認識電子郵件社交工程術的常見手法，以及如何防範這類攻擊行為的方式。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-30"}, {"date": "2023-10-23T14:00:00", "type": "教師研習", "time": "112年10月23日(一) 14:00-17:00", "title": "［教學力Plus+ 劇場力］劇場教學應⽤──如何利⽤劇場遊戲設計教學課程", "speaker": "衛武營藝術中心業師、響座劇團團長黃琦勝", "place": "社區圖書館", "people": null, "cid": "4001030", "codes": ["4001030"], "semester": "112-1", "source": "112-1!第10列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "衛武營藝術中心業師、響座劇團團長黃琦勝\n進修網師資（同課程）：[社專人士]衛武營藝術中心業師、響座劇團團長黃琦勝", "web_status": "4001030：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4001030", "endDate": "2023-10-23", "notes": "", "intro": "【素養時代】技高國文教學力Plus +\n多元開放的時代，每屆學生皆有不同的樣貌，而技高職科屬性的差異，也對映著學生殊異的個人特質。當代教師的挑戰，不單只是學科的深化增能，也涉及自身教學能力的提升，能因應不同型態的教學現場。這學年預定以「技高國文教學力Plus +」為社群主題，邀請在各領域優秀的講師帶領，藉由實作或工作坊等方式，提昇教師多樣的教學利器，讓課程更吸睛、讓表達更精準、讓活動更有意義，藉由教師的教學Plus +，對學生產生深刻影響。\n主題一：劇場力\n研習課程：劇場教學應⽤──如何利⽤劇場遊戲設計教學課程\n講師：衛武營藝術中心業師、響座劇團團長黃琦勝\n研習時間：112年10月23日(一) 14:00-17:00\n研習地點：高雄市立三民家商社區圖書館\n「以劇場作為一種生活方式，一種觀點」，劇場中有許多哲思和方法，確實都對應著教學端的我們。響座劇場長年投入在地的議題開創，結合餐飲、地方、文學等主題，展現相當豐碩的成果與影響力，盡力對高中職等教育現場師生的培力，更是不遺餘力，不管是讀劇體驗、課程融入、古典文學課程的結合等，持續帶來深化意義和迴響。很開心能由響座劇場導演黃琦勝，帶領我們體驗與認識劇場活動設計，一定能對課程教學深具啟發性。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-31"}, {"date": "2023-10-27T13:30:00", "type": "教師研習", "time": "112年10月27日（五）13:30-16:30", "title": "[素養導向]「生成式AI在教學上的應用」工作坊一(10/27)", "speaker": "民權國小、高雄市國教輔導團專輔葉士昇", "place": "第一會議室", "people": null, "cid": "4047875", "codes": ["4047875"], "semester": "112-1", "source": "112-1!第11列", "note": "原表標示協辦", "time_span": "13:30-16:30", "category": "實作工作坊", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "民權國小、高雄市國教輔導團專輔葉士昇\n進修網師資（同課程）：[中小幼師]葉士昇,[中小幼師]盧政良,[中小幼師]黃一軒", "web_status": "4047875：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4047875", "endDate": "2023-10-27", "notes": "原表標示協辦", "intro": "辦理日期： 每次3小時，總共3次，研習時數覈實核發。\n112年10月27日(星期五) 13:30~16:40\n112年11月10日(星期五) 13:30~16:40\n112年11月17日(星期五) 13:30~16:40\n辦理地點：三民家商第一會議室。\n目的：\n隨著生成式AI所帶來的自然語言對話模型的崛起，看到了它對社會及教育領域的深遠影響。這不僅帶來了前所未有的挑戰，更為教育打開了無數創新的大門。結合教育部推廣的「生生用平板」政策，AI在教學中的角色顯得尤為重要。AI導入課堂的優勢不止於協助學生學習，更讓教師在面對多元化的課堂\n112年10月27日(星期五) 13:30~16:40\n生成式AI的基本操作\nAI在自主學習上的應用&學習資源介紹\n112年11月10日(星期五) 13:30~16:40\n生成式AI在教學進階應用---備課上的應用\n生成式AI在教學進階應用---模擬學生屬性和試題檢測\n112年11月17日(星期五) 13:30~16:40\n生成式AI在教學進階應用---課後評量\n生成式AI在教學進階應用---即時回饋與協作", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-32"}, {"date": "2023-10-27T14:00:00", "type": "教師研習", "time": "112年10月27日（五）14:00-17:00", "title": "notion新一代雲端筆記高效學習工作術", "speaker": "茶米老師教室黃信溢", "place": "1205電腦教室", "people": null, "cid": "4001036", "codes": ["4001036"], "semester": "112-1", "source": "112-1!第12列", "note": "", "time_span": "14:00-17:00", "category": "實作工作坊", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "茶米老師教室黃信溢\n進修網師資（同課程）：[社專人士]茶米老師教室黃信溢", "web_status": "4001036：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4001036", "endDate": "2023-10-27", "notes": "", "intro": "研習課程：Notion--新一代雲端筆記高效學習工作術\n講師：茶米老師教室黃信溢\n時間：112年10月27日（五）14:00-17:00\n地點：高雄市立三民家商1305電腦教室（暫定）\nNotion是一款整合了筆記、知識庫、資料表格、看板、日曆等多種能力於一體的應用程式，使用者能單獨使用，也能跨平 高中的特點，在課程、教學與各式數位推動上，有許多值得交流、討論與發展之處。本年度社群將以「技職AI，家雄青！」為主題，嘗試探索AI運用技職教育、新興科技、數位融入課程的種種可能性與樣貌。四場社群分享，將由深耕數位學習、資訊素養、視覺認知等專長，國立高雄餐旅大學王靖曄教授指導數位融入的課程設計，探索AI運用技職教育的可能性。次由海青工商在新興科技推動十分有心得的李保宜組長，帶大家實作與體驗相關課程。高雄高商分享課程與行政推動的相關經驗，最終透過課程分享會的形式，共備與發表本學期核心教師們在課程開發的相關成果。\n社群主題三：數位課程與推動（暫定）\n講師：高雄高商教務處何秉鈞主任（暫定）\n時間：112年11月10日（五）14:00-16:00\n地點：三民家商4樓第二會議室", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-38"}, {"date": "2023-11-16T12:00:00", "type": "教師研習", "time": "112年11月16日（四）12:00-13:00", "title": "［數位結合］餐旅英語的文化探源", "speaker": "三民家商餐管科方幸君", "place": "餐飲美學教室", "people": null, "cid": "4132577", "codes": ["4132577"], "semester": "112-1", "source": "112-1!第17列", "note": "", "time_span": "12:00-13:00", "category": "專題講座", "audience": "教師", "theme": "專業領域與跨域實務", "speaker_full": "三民家商餐管科方幸君\n進修網師資（同課程）：[中小幼師]方幸君", "web_status": "4132577：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4132577", "endDate": "2023-11-16", "notes": "", "intro": "112-1跨域社群：餐旅與空間的文化探源\n文字作為根本，餐旅作為體驗與服務創發的專業，空間規劃所創造的意涵，豐富人文的深度感受與價值。在本學期社群的規劃中，重新回思文字在展覽與地域所凸顯的意涵。我們整合室設科專題中的餐飲空間規劃，深入成果展的討論，展現主題在餐會、策展的意義。藉由室設科成果展「飛。航」的辦理，以意象呈現觀光與夢想的實踐，展現色彩學運用的多元可能。社群由江菁菁主任、李娉儀老師帶領討論和思考，讓我們看見主體意象的重要性。\n餐旅、室設與國文的深化上 ，始終少不了文化探源的呈現。在社群課程發展上，我們以雙面向進行嘗試，餐飲管理科方幸君老師以英式下午茶作為主題，探索地域、文化和餐飲服務的運用；觀光科何糧朱老師置入旅館服務中常見的語言文化差異，探索空間中的服務行動樣貌。\n在學期特色開展上，我們選定「鹽」為主題意象，國文科一軒老師將結合高中國文瘂弦的詩作「鹽」、蕭麗紅《千江有水千江月》，探索鹽在文學中的多元角色，以及布袋作為文學情境的樣貌。並透過嘉義布袋州南鹽場的實際走訪，發現產業的源頭、地域和空間的變化、現今的文化轉型，及其所創造的觀光價值。透過社團法人嘉義縣布袋嘴文化協會的文史工作者的帶讀，認識地方再生的歷程，學習餐飲菜餚如何結合歷史、空間與文化，展現多元創新的樣貌。\n學期末社群的重頭戲，透過餐旅策劃達人蘇育弘老師，帶領大家討論和思考如何整合、盤點各項資源，達到最佳的餐旅服務效益，並且讓活動意義深刻難忘。\n本場次資訊\n時間：112年11月16日（四） 12:00-13:00\n主題：［數位結合］餐旅英語的文化探源\n講師：餐飲科方幸君師\n地點：餐飲美學教室", "hours": "1小時/學分", "countLabel": "參與人數", "id": "event-39"}, {"date": "2023-11-17T13:30:00", "type": "教師研習", "time": "112年11月17日（五）13:30-16:30", "title": "[素養導向]「生成式AI在教學上的應用」工作坊三(11/17)", "speaker": "三民家商國文科黃一軒", "place": "第一會議室", "people": null, "cid": "4047882", "codes": ["4047882"], "semester": "112-1", "source": "112-1!第18列", "no 設計吸睛的體驗、有趣的教學、深度的反思。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-41"}, {"date": "2023-11-23T12:00:00", "type": "教師研習", "time": "112年11月23日 （四）12:00-13:00", "title": "［數位結合］旅館服務的時空文化差異", "speaker": "三民家商觀光科何糧朱", "place": "餐飲美學教室", "people": null, "cid": "4132578", "codes": ["4132578"], "semester": "112-1", "source": "112-1!第20列", "note": "", "time_span": "12:00-13:00", "category": "專題講座", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "三民家商觀光科何糧朱\n進修網師資（同課程）：[中小幼師]何糧朱", "web_status": "4132578：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4132578", "endDate": "2023-11-23", "notes": "", "intro": "112-1跨域社群：餐旅與空間的文化探源\n文字作為根本，餐旅作為體驗與服務創發的專業，空間規劃所創造的意涵，豐富人文的深度感受與價值。在本學期社群的規劃中，重新回思文字在展覽與地域所凸顯的意涵。我們整合室設科專題中的餐飲空間規劃，深入成果展的討論，展現主題在餐會、策展的意義。藉由室設科成果展「飛。航」的辦理，以意象呈現觀光與夢想的實踐，展現色彩學運用的多元可能。社群由江菁菁主任、李娉儀老師帶領討論和思考，讓我們看見主體意象的重要性。\n餐旅、室設與國文的深化上 ，始終少不了文化探源的呈現。在社群課程發展上，我們以雙面向進行嘗試，餐飲管理科方幸君老師以英式下午茶作為主題，探索地域、文化和餐飲服務的運用；觀光科何糧朱老師置入旅館服務中常見的語言文化差異，探索空間中的服務行動樣貌。\n在學期特色開展上，我們選定「鹽」為主題意象，國文科一軒老師將結合高中國文瘂弦的詩作「鹽」、蕭麗紅《千江有水千江月》，探索鹽在文學中的多元角色，以及布袋作為文學情境的樣貌。並透過嘉義布袋州南鹽場的實際走訪，發現產業的源頭、地域和空間的變化、現今的文化轉型，及其所創造的觀光價值。透過社團法人嘉義縣布袋嘴文化協會的文史工作者的帶讀，認識地方再生的歷程，學習餐飲菜餚如何結合歷史、空間與文化，展現多元創新的樣貌。\n學期末社群的重頭戲，透過餐旅策劃達人蘇育弘老師，帶領大家討論和思考如何整合、盤點各項資源，達到最佳的餐旅服務效益，並且讓活動意義深刻難忘。\n本場次資訊\n時間：112年11月23日（四） 12:00-13:00\n主題：［數位結合］餐旅英語的文化探源\n講師：觀光科何糧朱師\n地點：餐飲美學教室", "hours": "1小時/學分", "countLabel": "參與人數", "id": "event-42"}, {"date": "2023-11-23T12:00:00", "type": "教師共備與分享", "time": "112年11月23日 （五）12:00-14:00", "title": "恆星學校社群：數位課程討論與增能研習", "speaker": "國立高雄餐旅大學旅館系王靖曄教授", "place": "第二會議室", "people": null, "cid": "4140413", "codes": ["4140413"], "semester": "112-1", "source": "112-1!第21列", "note": "原表星期與日期不符，待確認；原表時間排序欄為1124，時間文字為11月23日，待確認", "time_span": "12:00-14:00", "category": "社群共備與教學分享", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "國立高雄餐旅大學旅館系王靖曄教授\n進修網師資（同課程）：[大學教授]國立高雄餐旅大學師培中心王靖曄教授", "web_status": "4140413：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4140413", "en e": "教師研習", "time": "112年12月15日 （五）12:00-13:00", "title": "［數位結合］餐旅創新的展現手法", "speaker": "三民家商餐管科蘇育弘", "place": "餐飲美學教室", "people": null, "cid": "4132579", "codes": ["4132579"], "semester": "112-1", "source": "112-1!第25列", "note": "", "time_span": "12:00-13:00", "category": "專題講座", "audience": "教師", "theme": "專業領域與跨域實務", "speaker_full": "三民家商餐管科蘇育弘\n進修網師資（同課程）：[中小幼師]蘇育弘", "web_status": "4132579：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4132579", "endDate": "2023-12-15", "notes": "", "intro": "112-1跨域社群：餐旅與空間的文化探源\n文字作為根本，餐旅作為體驗與服務創發的專業，空間規劃所創造的意涵，豐富人文的深度感受與價值。在本學期社群的規劃中，重新回思文字在展覽與地域所凸顯的意涵。我們整合室設科專題中的餐飲空間規劃，深入成果展的討論，展現主題在餐會、策展的意義。藉由室設科成果展「飛。航」的辦理，以意象呈現觀光與夢想的實踐，展現色彩學運用的多元可能。社群由江菁菁主任、李娉儀老師帶領討論和思考，讓我們看見主體意象的重要性。\n餐旅、室設與國文的深化上 ，始終少不了文化探源的呈現。在社群課程發展上，我們以雙面向進行嘗試，餐飲管理科方幸君老師以英式下午茶作為主題，探索地域、文化和餐飲服務的運用；觀光科何糧朱老師置入旅館服務中常見的語言文化差異，探索空間中的服務行動樣貌。\n在學期特色開展上，我們選定「鹽」為主題意象，國文科一軒老師將結合高中國文瘂弦的詩作「鹽」、蕭麗紅《千江有水千江月》，探索鹽在文學中的多元角色，以及布袋作為文學情境的樣貌。並透過嘉義布袋州南鹽場的實際走訪，發現產業的源頭、地域和空間的變化、現今的文化轉型，及其所創造的觀光價值。透過社團法人嘉義縣布袋嘴文化協會的文史工作者的帶讀，認識地方再生的歷程，學習餐飲菜餚如何結合歷史、空間與文化，展現多元創新的樣貌。\n學期末社群的重頭戲，透過餐旅策劃達人蘇育弘老師，帶領大家討論和思考如何整合、盤點各項資源，達到最佳的餐旅服務效益，並且讓活動意義深刻難忘。\n本場次資訊\n時間：112年12月15日（五） 12:00-13:00\n主題：［數位結合］餐旅創新的展現手法\n講師：餐飲科蘇育弘師\n地點：餐飲美學教室", "hours": "1小時/學分", "countLabel": "參與人數", "id": "event-48"}, {"date": "2023-12-18T14:00:00", "type": "教師研習", "time": "112年12月18日(一) 14:00-17:00", "title": "［教學力Plus+ 表達力］表達力技巧增能──讓你的教學表達更吸睛", "speaker": "《極度吸睛》等書作者、注意力設計師曾培祐", "place": "社區圖書館", "people": null, "cid": "4001032", "codes": ["4001032"], "semester": "112-1", "source": "112-1!第26列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "《極度吸睛》等書作者、注意力設計師曾培祐\n進修網師資（同課程）：[社專人士]《極度吸睛》等書作者、注意力設計師曾培祐", "web_status": "4001032：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4001032", "endDate": "2023-12-18", "notes": "", "intro": "【素養時代】技高國文教學力Plus +\n多元開放的時代，每屆學生皆有不同的樣貌，而技高職科屬性的差異，也對映著學生殊異的個人特質。當代教師的挑戰，不單只是學科的深化增能，也涉及自身教學能力的提升，能因應不同型態的教學現場。這學年預定以「技高國文教學力Plus +」為社群主題，邀請在各領域優秀的講師帶領，藉由實作或工作坊等方式，提昇教師多樣的教學利器，讓課程更吸睛、讓表達更精準、讓活動更有意義，藉由教師的教學Plus +，對學生產生深刻影響。\n主題三：表達力\n研習課程：表達力技巧增能──讓你的教學表達更吸睛\n講師：《極度吸睛》等書作者、注意力設計師曾培祐\n研習時間：112年12月18日(一) 14:00-17:00\n研習地點：高雄市立三民家商社區圖書館\n曾培祐老師身兼企業講師、作家等多元的角色，總是爽朗的笑容，以上台簡報、故事行銷、吸睛教學、魅力演講等專題，在產業和教學界帶來豐沛的能量，近年三書《極度吸睛》、《表達吸睛》與《思考馬達》皆是暢銷書籍。表達力始終是教師重要的基礎能力，如何讓表達精準？如何讓教學聚焦？讓師生有更好的關係，讓聽眾願意聽，教學因而能產生動力。專業的培祐老師，將帶領發現擁有良好表達力的關鍵。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-49"}, {"date": "2023-12-29T14:00:00", "type": "教師研習", "time": "112年12月29日（五）14:00-16:00", "title": "網頁設計與應用", "speaker": "三民家商資訊執秘蔡錦泓", "place": "1205電腦教室", "people": null, "cid": "4188656", "codes": ["4188656"], "semester": "112-1", "source": "112-1!第27列", "note": "", "time_span": "14:00-16:00", "category": "實作工作坊", "audience": "教師", "theme": "圖書資訊與設備運用", "speaker_full": "三民家商資訊執秘蔡錦泓\n進修網師資（同課程）：[中小幼師]資訊執秘蔡錦泓", "web_status": "4188656：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4188656", "endDate": "2023-12-29", "notes": "", "intro": "三民家商新網頁將上線，網頁模組牽涉到公告、發布與修正，認識帳號運用、基礎操作十分重要，研習將說明網頁設計與安排思維，響應式呈現模式，以及Google sites如何運用、設計與操作。透過本次研習將讓與會師生認識網頁製作相關實務。\n研習主題：三民家商新網頁操作說明\n時間：2023年12月29日 14:00-16:00\n講師：資訊執秘蔡錦泓師\n地點：1205電腦教室", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-50"}, {"date": "2024-01-12T12:00:00", "type": "學生資訊培訓", "time": "113年1月12日（五）12:00-13:00", "title": "各式軟體的整合運用", "speaker": "本校資訊小組", "place": "圖書館視聽室", "people": 47.0, "cid": "", "codes": [], "semester": "112-1", "source": "112-1!第39列", "note": "年份依學期及月份補列", "time_span": "12:00-13:00", "category": "教育訓練與利用教育", "audience": "學生", "theme": "課程設計與教學實踐", "speaker_full": "本校資訊小組", "web_status": "原表無課程代碼，未查網頁；講師背景保留原表內容", "url": "", "endDate": "2024-01-12", "notes": "年份依學期及月份補列", "intro": "", "hours": "", "countLabel": "參與人數", "id": "event-51"}, {"date": "2024-01-15T14:00:00", "type": "教師研習", "time": "113年1月15日（五）14:00-17:00", "title": "「白恐不迷路地圖-入校推廣」葉石濤", "speaker": "家齊高中國文科呂覲芬、台南女中公民科楊素芳", "place": "國際文化教室", 究主題發想、文獻探討到完整論文架構生成，提供完整咒語與實作體驗\n- 課程大綱\n1. 解構學術研究流程\n2. 人機協作原則\n3. 詠唱九大招\n4. AI 輔助學術研究（皆有實作）：\n- 研究主題發想\n- 文獻探討\n- 論文撰寫\n- Office hour 模擬\n- 自主學習\n5. 新時代老師的新身分\nps.實作會從大綱上每個環節來依序操作，會提供prompt供老師參考，還有介紹Scispace, consensus等文獻探討。\n時間：113年3月8日(五) 14:00-17:00\n地點：本校4樓國際文化教室\n講師：爆學力AtomSkool學習長李承翰", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-54"}, {"date": "2024-03-18T14:00:00", "type": "教師研習", "time": "113年3月18日(一) 14:00-17:00", "title": "［小說力］小說技術運用於教學", "speaker": "作家朱宥勳", "place": "社區圖書館", "people": 46.0, "cid": "4213174", "codes": ["4213174"], "semester": "112-2", "source": "112-2!第8列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "作家朱宥勳\n進修網師資（同課程）：[社專人士]作家朱宥勳", "web_status": "4213174：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4213174", "endDate": "2024-03-18", "notes": "", "intro": "【素養時代】技高國文教學力Plus +\n多元開放的時代，每屆學生皆有不同的樣貌，而技高職科屬性的差異，也對映著學生殊異的個人特質。當代教師的挑戰，不單只是學科的深化增能，也涉及自身教學能力的提升，能因應不同型態的教學現場。這學年以「技高國文教學力Plus +」為社群主題，邀請在各領域優秀的講師帶領，藉由實作或工作坊等方式，提昇教師多樣的教學利器，讓課程更吸睛、讓表達更精準、讓活動更有意義，藉由教師的教學Plus +，對學生產生深刻影響。\n時間：113年3月18日(一) 14:00-17:00\n地點：高雄市立三民家商社區圖書館\n講師：作家朱宥勳\n#主題介紹\n小說技術其實時時對應生活，也是生存能力。作家朱宥勳是解讀小說的翹楚，無論敘事結構、角色塑造、觀點、節奏與情境等，理解和懂得運用小說技術，等同有高度面對和處理複雜人世的能力。對國文科來說，文本解析、敘事傳達等，都逃不過小說技術，這次就由犀利的文壇戰神親臨，傳授運用於國文教學的妙方。\n#講師簡歷\n朱宥勳，1988 年生。畢業於清華大學人文社會學系、清華大學台灣文學研究所，專長為現代小說、文學批評。曾獲金鼎獎、林榮三文學獎、全國學生文學獎、台積電青年文學獎。已出版個人小說集《誤遞》、《堊觀》，評論散文集《學校不敢教的小說》、《只要出問題，小說都能搞定》、「作家新手村」系列二冊、《他們沒在寫小說的時候：戒嚴台灣小說家群像》，長篇小說《暗影》、《湖上的鴨子都到哪裡去了》。與黃崇凱共同主編《台灣七年級小說金典》，並與朱家安合著《作文超進化》。目前擔任奇異果版高中國文課本執行主編，並於鳴人堂、蘋果日報、商周網站、想想論壇等媒體開設專欄。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-55"}, {"date": "2024-03-22T14:00:00", "type": "教師研習", "time": "113年3月22日(五) 14:00-17:00", "title": "iPad超好用：iMovie簡單打造你的專屬影片", "speaker": "蘋果傑出教育工作者、台北市志清國小李衿綺", "place": "國際文化教室", "people": 24.0, "cid": "4252328", "codes": ["4252328"], "semester": "112-2", "source": "112-2!第9列", "note": "", "time_span": "14:00-17:00", "category": 13:00:00", "type": "教師研習", "time": "113年4月30日(二) 13:00-16:00", "title": "Z3繪圖型生成式AI在教育上的應用", "speaker": "國立聯合大學、苗栗高中圖書館主任黃琇苓", "place": "觀光科旅遊教室", "people": 56.0, "cid": "4307770", "codes": ["4307770"], "semester": "112-2", "source": "112-2!第21列", "note": "", "time_span": "13:00-16:00", "category": "專題講座", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "國立聯合大學、苗栗高中圖書館主任黃琇苓\n進修網師資（同課程）：[大學教授]國立聯合大學黃琇苓", "web_status": "4307770：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4307770", "endDate": "2024-04-30", "notes": "", "intro": "課程名稱：Z3繪圖型生成式AI在教育上的應用\n講師：國立聯合大學、苗栗高中圖書館主任黃琇苓\n日期：113年4月30日（週二）13:30～16:30\n地點：三民家商4樓旅遊教室\nps.請參與教師攜帶自己的行動載具，現場也有平板可供借用\nps2.本校停車位有限，建議多運用捷運。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-68"}, {"date": "2024-05-13T14:00:00", "type": "教師研習", "time": "113年5月13日(一) 14:00-17:00", "title": "［訪談力］訪談與書寫的人文關懷", "speaker": "作家林立青", "place": "社區圖書館", "people": 47.0, "cid": "4213176", "codes": ["4213176"], "semester": "112-2", "source": "112-2!第22列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "作家林立青\n進修網師資（同課程）：[社專人士]作家林立青", "web_status": "4213176：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4213176", "endDate": "2024-05-13", "notes": "", "intro": "【素養時代】技高國文教學力Plus +\n多元開放的時代，每屆學生皆有不同的樣貌，而技高職科屬性的差異，也對映著學生殊異的個人特質。當代教師的挑戰，不單只是學科的深化增能，也涉及自身教學能力的提升，能因應不同型態的教學現場。這學年以「技高國文教學力Plus +」為社群主題，邀請在各領域優秀的講師帶領，藉由實作或工作坊等方式，提昇教師多樣的教學利器，讓課程更吸睛、讓表達更精準、讓活動更有意義，藉由教師的教學Plus +，對學生產生深刻影響。\n時間：113年5月13日(一) 14:00-17:00\n地點：高雄市立三民家商社區圖書館\n講師：作家林立青\n#主題介紹\n這個時代文體的界線越來越模糊，但書寫的根基仍來自於人與人的真實相處。我們站在什麼位置？如何與他人互動和溝通，為何而敘說？訪談和田調是深入理解的基礎，這樣的方法學，正是作家林立青擅長的書寫技術。從技術到藝術，從感受、觀察、理解到書寫，由林立青帶領我們學習訪談力，發現書寫所帶來的人文關懷力量。\n#講師簡歷\n林立青，本名林亞靖，1985年生，畢業於東南科技大學進修部土木工程系。由於發現「大多數的人真的不懂工地」，於是決定「寫到別人懂」，相信深刻的描述可以引人同理，進而減少誤解和歧視。著有《做工的人》、《如此人生》。其中《做工的人》由現場視角為工地師傅的尊嚴發聲之作，甫出版便登上各大暢銷排行榜，引發各界熱切討論與持續關注，曾榮獲金石堂「十大影響力好書」、Openbook好書獎「美好生活書」，以及誠品書店閱讀職人大賞「最想賣」、「年度最期待在地作家」，更改編為台灣電視劇集，影響深遠。\n更多細節：https://www.cw.com.tw/article/5126162", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-69"}, {"date": "2024-06-03T12:00:00", "type": "公開觀課", "time": "113年6月3日(一) 12:00-15:00", "title": "113科技輔助自主學習計畫公開觀課：藝情創音樂，藝術與情緒的對話", "speaker": "三民家商音樂科廖悌妏、高雄市新莊高中洪佳慧主任", "place": "音樂教室", "people": 9.0, "cid": "4381622", "codes": ["4381622"], "semester": "112-2", "source": "112-2!第25列", "note": "", "time_span": "12:00-15:00", "category": "公開授課與觀議課", "audience": "教師", "theme": "環境、藝術與社會情緒學習", "speaker_full": "三民家商音樂科廖悌妏、高雄市新莊高中洪佳慧主任\n進修網師資（同課程）：[中小幼師]三民家商音樂科廖悌妏,[中小幼師]新莊高中洪佳慧主任", "web_status": "4381622：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4381622", "endDate": "2024-06-03", "notes": "", "intro": "[113年科技輔助自主學習公開觀議課]\n您知道情緒可能是有顏色的嗎？\n情緒牽動日常，帶來不一樣的感知。\n而音樂更是情緒最好的傳達方式，\n在這節課裡，藝術將與情緒產生對話～\nAi科技將協助傳達心聲，歡迎一起來觀課，一起藝情創音樂。\n時間：2024年6月3日（一）\n說課：12:00-13:00\n觀課：13:00-14:00\n議課：14:00-15:00\n議課討論：高雄市新莊高中洪佳慧主任\n授課教師：音樂科廖悌妏\n授課地點：音樂教室", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-70"}, {"date": "2024-06-04T08:00:00", "type": "師生共學", "time": "113年6月4日(二) 08:00-12:00", "title": "PMS（Property Management System）在餐旅產業的應用", "speaker": "高雄餐旅大學旅館管理系助理教授許孟鈞", "place": "觀二勤", "people": 34.0, "cid": "", "codes": [], "semester": "112-2", "source": "112-2!第23列", "note": "", "time_span": "08:00-12:00", "category": "專題講座", "audience": "師生共學", "theme": "專業領域與跨域實務", "speaker_full": "高雄餐旅大學旅館管理系助理教授許孟鈞", "web_status": "原表無課程代碼，未查網頁；講師背景保留原表內容", "url": "", "endDate": "2024-06-04", "notes": "", "intro": "", "hours": "", "countLabel": "參與人數", "id": "event-71"}, {"date": "2024-06-11T08:00:00", "type": "師生共學", "time": "113年6月11日(二) 08:00-12:00", "title": "PMS（Property Management System）在餐旅產業的應用", "speaker": "高雄餐旅大學旅館管理系助理教授許孟鈞", "place": "觀二和", "people": 33.0, "cid": "", "codes": [], "semester": "112-2", "source": "112-2!第24列", "note": "", "time_span": "08:00-12:00", "category": "專題講座", "audience": "師生共學", "theme": "專業領域與跨域實務", "speaker_full": "高雄餐旅大學旅館管理系助理教授許孟鈞", "web_status": "原表無課程代碼，未查網頁；講師背景保留原表內容", "url": "", "endDate": "2024-06-11", "notes": "", "intro": "", "hours": "", "countLabel": "參與人數", "id": "event-72"}, {"date": "2024-06-11T08:00:00", "type": "公開觀課", "time": "113年6月11日(二) 08:00-11:00", "title": "113數位精進計畫公開觀議課：生活中的字體", "speaker": "三民家商室內設計科蔡迺玟、國立高雄餐旅大學王靖曄教授", "place": "基本設計教室", "people": 10.0, "cid": "4387324", "codes": ["4387324"], "semester": "112-2", "source": "112-2!第26列", "note": "", "time_span": "08:00-11:00", "category": "公開授課與觀議課", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "三民家商室內設計科蔡迺玟、國立高雄餐旅大學王靖曄教授\n進修網師資（同課程）：[中小幼師]室內設計科蔡迺玟,[大學教授]國立高雄餐旅大學王靖曄", "web_status": "4387324：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4387324", "endDate": "2024-06-11", "notes": "", "intro": "[113年數位精進計畫公開觀議課]\n生活中的字體。\n文字帶來智慧，\n賦予感知和豐富的想像世界。\n一字能千金，字如奇人而字字珠璣，\n在美學的生活世界裡，\n我們如何結合科技，\n認識、欣賞甚至創作這些字體呢？\n時間：2024年6月11日（二）\n說課：8:00-9:00\n觀課：9:00-10:00\n議課：10:00-11:00\n議課討論：國立高雄餐旅大學王靖曄教授\n授課教師：室內設計科蔡迺玟\n授課地點：室設科2F基本設計教室", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-73"}, {"date": "2024-06-17T14:00:00", "type": "教師研習", "time": "113年6月17日(一) 14:00-17:00", "title": "［追劇力］追劇與我的國文教學", "speaker": "作家羊咩老師", "place": "社區圖書館", "people": 60.0, "cid": "4213178", "codes": ["4213178"], "semester": "112-2", "source": "112-2!第27列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "作家羊咩老師\n進修網師資（同課程）：[中小幼師]作家羊咩老師", "web_status": "4213178：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4213178", "endDate": "2024-06-17", "notes": "", "intro": "【素養時代】技高國文教學力Plus +\n多元開放的時代，每屆學生皆有不同的樣貌，而技高職科屬性的差異，也對映著學生殊異的個人特質。當代教師的挑戰，不單只是學科的深化增能，也涉及自身教學能力的提升，能因應不同型態的教學現場。這學年以「技高國文教學力Plus +」為社群主題，邀請在各領域優秀的講師帶領，藉由實作或工作坊等方式，提昇教師多樣的教學利器，讓課程更吸睛、讓表達更精準、讓活動更有意義，藉由教師的教學Plus +，對學生產生深刻影響。\n時間：113年6月17日(一) 14:00-17:00\n地點：高雄市立三民家商社區圖書館\n講師：作家羊咩老師\n#主題介紹\n這是一門深受歡迎的獨特國文課，預習我們未來的人生，在低沉沮喪時，讓人看見自己的優雅起身。劇集與古文能準確對接，帶領讀者有如親身走過前人的遭遇，從而習得珍貴的人生方向：遭逢物是人非、生死離散、兩難困境時的選擇，以及面對驟雨飆風的心態。讓我們一起聆聽與發現，如何從追劇到國文，如何喚醒學子對人世的深刻體悟。\n#講師簡歷\n本名楊明，畢業於中山大學中文所，現任職於新北私立南山中學。是一名愛追劇、愛電影、愛動漫的高中國文老師。擅長將艱澀的古文搭配電影、戲劇，用淺顯易懂的比喻，找到和年輕學生連線的方法。在她的國文課上，師生一起為課文中的情感流淚，是常見的風景。她期許自己成為「文學的推銷員」，推銷文學療育生命的力量，為所有閱讀者準備一堂人生的國文課。現有臉書粉絲團「羊咩老師的追劇國文課」，深受學生、家長與各校教師的歡迎。並有多篇文章發表於《商周》、《方格子》、《龍騰知識+》等各網路平台。\n更多細節：https://www.eslite.com/product/1001116172682122244005", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-74"}, {"date": "2024-06-21T10:00:00", "type": "公開觀課", "time": "113年6月21日(五) 10:00-13:00", "title": "113數位精進計畫恆星學校公開觀議課：探索領團風格，發現未曾謀面的自己", "speaker": "三民家商觀光科李育冠、高雄餐旅大學旅館管理系助理教授許孟鈞", "place": "觀光科旅遊教室", "people": 15.0, "cid": "4413630", "codes": ["4413630"], "semester": "112-2", "source": "112-2!第28列", "note": "", "time_span": "10:00-13:00", "category": "公開授課與觀議課", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "三民家商觀光科李育冠、高雄餐旅大學旅館管理系助理教授許孟鈞\n進修網師資（同課程）：[中小幼師]觀光科李育冠,[大學教授]國立高雄餐旅大學許孟鈞教授", "web_status": "4413630：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4413630", "endDate": "2024-06-21", "notes": "", "intro": "[113年數位學習精進高雄市恆星學校公開觀議課]\n旅遊是探索世界，\n也是認識自己的方法。\n作為領團觀光專業人才，\n發現自己的特質，\n善用優勢，\n能創造他人與自我絕佳的旅行感受。\n歡迎一起來探索\n您可能的領團風格\n在旅途中，\n發現未來\n那個未曾謀面的自己。\n時間：2024年6月21日（五）\n說課：10:00-11:10\n觀課：11:10-12:00\n議課：12:00-13:00\n議課討論：\n國立高雄餐旅大學\n許孟鈞教授\n授課教師：觀光科李育冠\n地點：觀光科旅遊教室", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-75"}, {"date": "2024-08-11T10:00:00", "type": "走讀與參訪", "time": "113年8月11日(日)10:00-18:00", "title": "[環境教育]跨域社群：走讀旗津，時空與產業整合的社會實踐", "speaker": "國立中山大學USR經理林芮君,大港校CC青培站儲伯如,山津塢創辦人張淑雯,潤物設計Artelier創辦人、空間設計師溫硯萍", "place": "旗津社會開創基地", "people": 19.0, "cid": "4494475", "codes": ["4494475"], "semester": "113-1", "source": "113-1!第31列", "note": "", "time_span": "10:00-18:00", "category": "走讀參訪與體驗", "audience": "教師", "theme": "環境、藝術與社會情緒學習", "speaker_full": "國立中山大學USR經理林芮君,大港校CC青培站儲伯如,山津塢創辦人張淑雯,潤物設計Artelier創辦人、空間設計師溫硯萍\n進修網師資（同課程）：[社專人士]國立中山大學ＵＳＲ經理林芮君,[社專人士]大港校CC青培站儲伯如,[社專人士]山津塢創辦人張淑雯,[社專人士]潤物設計Artelier創辦人、空間設計師溫硯萍", "we ，或者分享自己操作的模式。本次研習地點將在圖書館新設的人文數位學習空間，也歡迎一起來認識新場域，借本好書，迎接2025年的來臨。\n時間：2024年12月27日(五) 14:00-16:00\n地點：本校4F圖書館（人文數位學習空間）\n講師：盛源科技原廠講師", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-100"}, {"date": "2025-01-04T08:00:00", "type": "走讀與參訪", "time": "114年1月4日(六)8:00-14:00", "title": "[環境教育]跨校社群：造訪原生藝術中心，體會有愛無礙的藝術啟發", "speaker": "原生藝術育成中心葉世原老師、藝術家黃宥凱、曾博笙、蘇亦和、謝秉鈞、高進宇、力政文、陳奕綾", "place": "楠梓特殊學校(原生藝術中心)", "people": 23.0, "cid": "4839492", "codes": ["4839492"], "semester": "113-1", "source": "113-1!第29列", "note": "", "time_span": "8:00-14:00", "category": "走讀參訪與體驗", "audience": "教師", "theme": "環境、藝術與社會情緒學習", "speaker_full": "原生藝術育成中心葉世原老師、藝術家黃宥凱、曾博笙、蘇亦和、謝秉鈞、高進宇、力政文、陳奕綾\n進修網師資（同課程）：[社專人士]葉世原老師,[社專人士]黃宥凱、曾博笙、蘇亦和、謝秉鈞、高進宇、力政文、陳奕綾", "web_status": "4839492：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4839492", "endDate": "2025-01-04", "notes": "", "intro": "跨校社群年度鉅獻，共訪原生藝術中心\n體會有愛無礙的藝術啟發\n新的年度，讓我們跨校社群一起來趟特別的旅程。\n還記得三年前我們一起觀影林正盛導演的《地球迷航》嗎？\n觀影時，我們深受感動，理解差異，認識緣由，可能都讓我們擁有雙不同的眼睛，重新看見世界的真實樣貌，進而在同理中，深深被嘗試突破困頓的生命而感動。生命的樣貌之豐富多元，如同恆河沙數、如同天上繁星閃閃，在生命前行的路上，有迷航、有紛雜、有階段、有千變萬化的迷人光彩，創造人世間數不盡的動人故事。\n這一次，難能可貴，我們就走進故事裡。\n感謝雄商李桂仙老師的安排，跨校社群有機會走進原生藝術中心的場域，聆聽師鐸獎得主葉世原老師敘說藝術如何改變一群孩子的生命，陪伴、教學、課程如何豐富彼此的人生。我們更將和藝術家黃宥凱、曾博笙、蘇亦和、謝秉鈞、高進宇、力政文、陳奕綾跟他們的家人一起用餐對談，認識每個生命遭遇的迷航、困頓，同時也因差異而創造的精彩世界。歡迎有空社群夥伴，一起參與。\n參訪時間：114年1月4日（六）8:00-14:00\n參訪地點：高雄市楠梓特殊學校附設育成中心\n專題講座與協同：葉世原老師、楠梓特殊學校劉映廷秘書、職能治療師郭俊宏老師\n參與藝術家：黃宥凱、曾博笙、蘇亦和、謝秉鈞、高進宇、力政文、陳奕綾", "hours": "6小時/學分", "countLabel": "參與人數", "id": "event-101"}, {"date": "2025-01-10T12:30:00", "type": "教師研習", "time": "114年1月10日(五)12:30-16:30", "title": "五感饗宴，法餐之美——探索米其林精緻餐飲魅力", "speaker": "「SENS」主廚吳定祐", "place": "美學教室、小禮堂", "people": 224.0, "cid": "4860161", "codes": ["4860161"], "semester": "113-1", "source": "113-1!第34列", "note": "", "time_span": "12:30-16:30", "category": "專題講座", "audience": "其他／待確認", "theme": "專業領域與跨域實務", "speaker_full": "「SENS」主廚吳定祐\n進修網師資（同課程）：[社專人士]主廚吳定祐", "web_status": "4860161：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4860161", "endDate": "2025-01-10", "notes": "", "intro": "✨ 五感饗宴，法餐之美——探索米其林精緻餐飲魅力\n👨‍🍳 「SENS」主廚吳定祐 | Chef Darius Wu 專題分享\n🍴 從12歲開始接觸法式料理，到26歲摘得米其林星級榮耀，定祐主廚以其對料理的熱愛和不懈追求，將法國料理的經典精髓與當代創意完美結合，創造出驚豔感官的饗宴。他的作品融入故事情感與在地文化，以細膩手法重新詮釋法餐美學，堅持以優質食材🥗、精湛技藝🔪和精準調味🧂為基石，帶領賓客探索料理的深刻內涵。\n📌 此次演講，Chef Darius 將親臨馨園，回顧三民家商的歲月，分享他在米其林餐廳的豐富經歷與餐飲業的心路歷程，啟發每位與會者重新思考對美食與生活的感知。作為一位國際級主廚，重新回到餐飲孕育之地，一定帶來深刻的感受！\n第一場：跨域社群專業教師講座\n日期：114年1月10日（五）\n時間：12:35-13:30\n地點：餐管科美學教室\n分享對象：國文、餐管、室設、觀光及其他科有興趣教師\n📋 內容：\n1️.米其林餐廳的 fine dining 組成元素\n2️.主廚的求學與職涯故事\n3️.教師在學生生命中影響力的深遠意義\nPs.本場次無提供中餐\n第二場：師生專題分享\n時間：14:10-16:00\n地點：小禮堂\n分享對象：餐管科學生\n📋 內容：\n1️.主廚自我介紹與米其林餐廳精緻餐飲介紹\n2️.求學與職涯分享：從法餐學徒到米其林主廚的挑戰與堅持\n3️.餐飲業的挑戰、自我實現與未來展望\n4️.給學弟妹的真心話：邁向米其林之路\n🔗 認識米其林餐廳「SENS」與主廚吳定祐\n🌐 https://www.senstw.com/tw", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-102"}, {"date": "2025-02-06T09:00:00", "type": "教師研習", "time": "114年2月6日(四)9:00-12:00", "title": "Apple Teacher 入門班: iPad 基礎應用", "speaker": "Apple Distinguished Educator、葳格高中副校長黃文貞", "place": "人文數位學習空間", "people": 26.0, "cid": "4860128", "codes": ["4860128"], "semester": "113-2", "source": "113-2!第2列", "note": "", "time_span": "9:00-12:00", "category": "實作工作坊", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "Apple Distinguished Educator、葳格高中副校長黃文貞\n進修網師資（同課程）：[社專人士]Apple原廠講師", "web_status": "4860128：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4860128", "endDate": "2025-02-06", "notes": "", "intro": "課程說明：\n1. 認識iPad 在課堂的定位與教學應用\n2. iPad 在多功能模式下的輔助模式", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-103"}, {"date": "2025-02-06T13:00:00", "type": "教師研習", "time": "114年2月6日(四)13:00-16:00", "title": "Apple Teacher iWork班: 人人可創造", "speaker": "Apple Distinguished Educator、葳格高中副校長黃文貞", "place": "人文數位學習空間", "people": 30.0, "cid": "4860129", "codes": ["4860129"], "semester": "113-2", "source": "113-2!第3列", "note": "", "time_span": "13:00-16:00", "category": "實作工作坊", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "Apple Di 環境", "speaker": "三民家商國文科郭欣怡老師、高師大附中國文科許靜宜", "place": "圖書館", "people": 7.0, "cid": "4991731", "codes": ["4991731"], "semester": "113-2", "source": "113-2!第19列", "note": "", "time_span": "9:30-12:30", "category": "公開授課與觀議課", "audience": "教師", "theme": "AI與數位教學應用", "speaker_full": "三民家商國文科郭欣怡老師、高師大附中國文科許靜宜\n進修網師資（同課程）：[中小幼師]郭欣怡,[中小幼師]許靜宜", "web_status": "4991731：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4991731", "endDate": "2025-04-11", "notes": "", "intro": "[114數位精進計畫公開觀課 - 漫遊小說意象與環境]\n您是否曾在閱讀小說時，感受到文字描繪的場景氛圍？\n感受某些特別豐富意象，無論是盛開的「玫瑰」或是某種濃烈的「色澤」。\n文字中的環境與意象， 不只是背景，更是作者埋藏的秘密符碼， 悄悄透露著人物的心境與故事的伏筆。\n在這堂「小說中的意象與環境」課裡， 我們將跟隨郭欣怡老師的引導， 深入張愛玲〈紅玫瑰與白玫瑰〉的文字世界， 一起探索環境如何烘托氛圍，意象又隱藏了哪些秘密。\n歡迎一起來觀課，漫遊於小說的字裡行間！\n時間：2025年4月11日（五）\n說課： 9:30 - 10:00\n觀課： 10:10 - 12:00\n議課： 12:00 - 12:30\n議課討論：許靜宜 老師 (高師大附中國文科 / 國文學科中心研發教師)\n授課教師： 國文科 郭欣怡 老師 （課程協同葉秀婕老師、黃一軒老師）\n授課地點： 幼二勤 教室", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-112"}, {"date": "2025-04-14T14:00:00", "type": "教師研習", "time": "114年4月14日(一)14:00-16:00", "title": "痴與負：古典小說中的兩性書寫", "speaker": "國立台北教育大學語創系退休教授、作家廖玉蕙", "place": "藝文共享空間", "people": 52.0, "cid": "4918991", "codes": ["4918991"], "semester": "113-2", "source": "113-2!第6列", "note": "", "time_span": "14:00-16:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "國立台北教育大學語創系退休教授、作家廖玉蕙\n進修網師資（同課程）：[社專人士]作家廖玉蕙,[中小幼師]家齊高中呂覲芬", "web_status": "4918991：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=4918991", "endDate": "2025-04-14", "notes": "", "intro": "113-2「跨越與整合」建構國語文教學的深度與高度\n本學期，我們高雄市高中職國語文跨校教師社群走進第八年了。將以「跨越與整合」為核心主題，透過文學、教學與數位的多元對話，共同探索國語文教學能建構的深度與高度。這學期預計規劃三大主題：「文學大師講堂」、「社群教師分享」、「教學思維探索」，並邀請知名學者、作家及社群內優秀教師，共同展開一系列精彩講座與工作坊。\n📖 古典文學的當代新篇\n主題一：文學大師講堂\n從古典小說的書寫脈絡，歷史與生活的日常，到數位時代的文學閱讀與寫作，我們邀請文學名家帶來多元視角的分享。\n📌 痴與負：古典小說中的兩性書寫\n講者：廖玉蕙（國立台北教育大學語創系退休教授、作家）\n🗓️ 114年4月14日(一) 14:00-16:00\n📍　高雄市立三民家商藝文共享空間（原社區圖書館）\n主題二：社群教師分享\n透過現場教師的實踐經驗交流，引發國文教學的新思維與應用。\n📌 AI來襲，讓諸子百家對讀電影鍛鍊你的思辨力\n講者：呂覲芬（家齊高中國文科）\n🗓️ 114年4 39"}, {"date": "2025-08-28T09:00:00", "type": "教師研習", "time": "114年8月28日(四)9:00-12:30", "title": "[資通安全]次世代數位公民素養：AI 時代的資訊判讀與資通安全", "speaker": "台灣放伴教育協會理事長謝忠瑋", "place": "小禮堂", "people": 180.0, "cid": "5182428", "codes": ["5182428"], "semester": "114-1", "source": "114-1!第26列", "note": "", "time_span": "9:00-12:30", "category": "專題講座", "audience": "教師", "theme": "資訊素養與資通安全", "speaker_full": "台灣放伴教育協會理事長謝忠瑋\n進修網師資（同課程）：[社專人士]台灣放伴基金會理事長謝忠瑋", "web_status": "5182428：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=5182428", "endDate": "2025-08-28", "notes": "", "intro": "資通安全研習｜次世代數位公民素養：AI 時代的資訊判讀與資通安全\n時間：2025 年 8 月 28 日（四）9:30–12:30\n地點：高雄市立三民家商小禮堂\n講師：台灣放伴基金會理事長謝忠瑋\n在這個 AI 技術日新月異的時代，「數位公民素養」不再只是教室裡的大哉問，而是我們必備的現實能力。由台灣放伴教育協會推動的跨領域議題融合教學，正開啟台灣教育一場緩慢卻深遠的社會變革。理事長謝忠瑋為放伴教育協會的要角，不僅長年耕耘教育現場，推動媒體識讀、資訊判讀等素養，更透過調查研究指出：多數學生雖自認辨識錯誤資訊能力強，卻少使用查證工具，這樣的現象值得我們深思。他秉持教育即行動的理念，不只是知識傳遞，更強調共備、共創與實踐。\n本次研習將由謝忠瑋老師親臨掌舵，引領我們：\n1.探討 AI 浪潮下，資訊真偽的判讀要素與通識觀點；\n2.鞏固資通安全基本觀念，提升日常防護意識；\n3.體驗放伴教學方法，學習如何在教育現場傳遞數位素養。\n三小時精鍊研習，與您一起開啟 AI 時代的「慧眼」，構築更安全、更理性的數位生活。", "hours": "3小時/學分", "countLabel": "參與人數", "id": "event-140"}, {"date": "2025-09-03T15:00:00", "type": "圖書館利用教育", "time": "114年9月3日(三) 15:00-16:00", "title": "圖書館利用教育-圖書與線上資料庫運用方法（餐一和）", "speaker": "圖書館主任葉秀婕、餐飲科顏鳳珍", "place": "階梯影音教室", "people": 35.0, "cid": "", "codes": [], "semester": "114-1", "source": "114-1!第64列", "note": "", "time_span": "15:00-16:00", "category": "教育訓練與利用教育", "audience": "學生", "theme": "圖書資訊與設備運用", "speaker_full": "圖書館主任葉秀婕、餐飲科顏鳳珍", "web_status": "原表無課程代碼，未查網頁；講師背景保留原表內容", "url": "", "endDate": "2025-09-03", "notes": "", "intro": "", "hours": "", "countLabel": "參與人數", "id": "event-141"}, {"date": "2025-09-04T00:00:00", "type": "圖書館利用教育", "time": "114年9月4日(四)", "title": "圖書館利用教育-圖書與線上資料庫運用方法（餐一勤）", "speaker": "圖書館主任葉秀婕、餐飲科李育冠", "place": "階梯影音教室", "people": 36.0, "cid": "", "codes": [], "semester": "114-1", "source": "114-1!第65列", "note": "原表未填時段", "time_span": "未載明", "category": "教育訓練與利用教育", "audience": "學 留原表內容", "url": "", "endDate": "2025-10-30", "notes": "", "intro": "", "hours": "", "countLabel": "參與人數", "id": "event-168"}, {"date": "2025-11-03T14:00:00", "type": "教師研習", "time": "114年11月3日(一)14:00-17:00", "title": "【人文讀書會講座】從文學看見性別：當書寫成為思辨的起點", "speaker": "作家、中山大學駐校作家陳栢青", "place": "人文數位學習空間", "people": 20.0, "cid": "5314327", "codes": ["5314327"], "semester": "114-1", "source": "114-1!第8列", "note": "", "time_span": "14:00-17:00", "category": "專題講座", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "作家、中山大學駐校作家陳栢青\n進修網師資（同課程）：[社專人士]作家陳柏青", "web_status": "5314327：已讀取", "url": "https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=5314327", "endDate": "2025-11-03", "notes": "", "intro": "從文學看見性別：敘事成為思辨的起點\n📅 時間：114年11月3日（星期一）14:00–16:00\n🏫 主辦單位：高雄醫學大學性別研究所、Phedo台灣高中哲學教育推廣學會\n🤝 協辦單位：三民家商\n👤 講者：陳栢青（小說家、台灣文學獎得主）\n【課程介紹】\n閱讀，不只是欣賞文字的美，更是理解人與世界的過程。\n文學中的「性別」往往映照出社會的權力結構、文化符號與內在矛盾。\n本次讀書會邀請知名小說家陳栢青，帶領教師與學生從故事出發，探索文學作品中性別的多重意象，思考：\n1.為何性別成為文學表達的核心之一？\n2.敘事如何形塑我們對「男性」「女性」的想像？\n3.教師又能如何引導學生以人文視角理解這些現象？\n人文讀書會講座：性別麻煩？性別．麻煩！\n主辦單位：高醫性別所、Phedo台灣高中哲學教育推廣學會\n協辦單位：三民家商\n【講座介紹】\n「性別」一直是最難以討論但也最廣泛被討論的議題。台灣現今真的「女權當道」了嗎？性別權力是不是真的是一種「兩性憑拳」的權力鬥爭？性別也是哲學所關切的論題，涉及意識、身體等邊界的探討。\n在課堂中，教師或許也會遇到如「女性化妝打扮算不算把自己商品化？」、「要求男生有紳士風度是不是父權規訓」等一時難以有周全論述的時刻。\n本系列講座邀請專家學者到校園中，不是政令宣導，而是和高中師生一起暢談性別議題，釐清性別歷史中的千頭萬緒。\n【講者介紹】\n11/3陳栢青\n台灣大學台灣文學研究所畢業。曾獲全球華人青年文學獎、中國時報文學獎、聯合報文學獎、林榮三文學獎、台灣文學獎、梁實秋文學獎等。作品曾入選《青年散文作家作品集──中英對照台灣文學選集》、《兩岸新銳作家精品集》，並多次入選《九歌年度散文選》。獲《聯合文學》雜誌譽為「台灣四十歲以下最值得期待的小說家」。另曾以筆名葉覆鹿出版小說《小城市》，以此獲九歌兩百萬文學獎榮譽獎、第三屆全球華語科幻星雲獎銀獎。\n另著有散文集《Mr. Adult大人先生》、長篇小說《尖叫連線》（獲2020Openbook好書獎「年度中文創作」）。", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-169"}, {"date": "2025-11-07T12:00:00", "type": "學生資訊培訓", "time": "114年11月7日(五) 12:00-13:00", "title": "資安的基礎概念與數位軟體解決方法", "speaker": "資訊執秘黃一軒、資訊組長蔡錦泓", "place": "階梯影音教室", "people": 60.0, "cid": "", "codes": [], "semester": "114-1", "source": "114-1!第55列", "note": "", "time_span": "12:00-13:00", "category": "教育訓練與利用教育", "audience": "學生", "theme": "資訊素養與資通安全", "spea ew.aspx?cid=5314330", "endDate": "2025-11-17", "notes": "", "intro": "從理解到對話： 啟航性別教育之旅\n📅 時間：114年11月17日（星期一）14:00–16:00\n🏫 主辦單位：高雄醫學大學性別研究所、Phedo台灣高中哲學教育推廣學會\n🤝 協辦單位：三民家商\n👤 講者：林苗玄（高雄醫學大學性別研究所研究助理、課程委員會委員）\n【課程介紹】\n日常生活中，我們不斷在性別的脈絡裡互動——\n從語言、行為到教育現場的期待與規範。\n而這些日常經驗，也正是人文教育最豐富的討論素材。\n本次讀書會由林苗玄老師以性別研究為切入，帶領教師重新思考：\n1.性別觀點如何深化我們對社會與文化的理解\n2.校園中性別議題的成因與應對方式\n3.如何將性別平等教育融入日常課程設計與對話\n人文讀書會講座：性別麻煩？性別．麻煩！\n主辦單位：高醫性別所、Phedo台灣高中哲學教育推廣學會\n協辦單位：三民家商\n【講座介紹】\n「性別」一直是最難以討論但也最廣泛被討論的議題。台灣現今真的「女權當道」了嗎？性別權力是不是真的是一種「兩性憑拳」的權力鬥爭？性別也是哲學所關切的論題，涉及意識、身體等邊界的探討。\n在課堂中，教師或許也會遇到如「女性化妝打扮算不算把自己商品化？」、「要求男生有紳士風度是不是父權規訓」等一時難以有周全論述的時刻。\n本系列講座邀請專家學者到校園中，不是政令宣導，而是和高中師生一起暢談性別議題，釐清性別歷史中的千頭萬緒。\n【講者介紹】\n11/17林苗玄\n高醫醫學大學性別研究所研究助、高師大博士、高雄醫學大學性別研究所課程委員會委員\n性別基礎概念或性別平等意識培力、性別主流化概論（含概念、緣起、國內發展與國際現狀）、性別主流化融入政策實務（方案、計畫、措施）、性別影響評估基礎概念／案例分析、性別分析原理與技巧、權力、決策與影響力、教育、文化與媒體、健康、醫療與照顧、性別與教育、性別與健康、性別與政治、性別與媒體、性別與空間、工程、設計、性別與民俗、宗教、性別與文史藝術（文化產業等）。", "hours": "2小時/學分", "countLabel": "參與人數", "id": "event-177"}, {"date": "2025-11-21T08:00:00", "type": "公開觀課", "time": "114年11月21日(五)8:00-9:00", "title": "高師大公開觀課：自然寫作--土地、生命與文字的對話", "speaker": "國文科黃一軒、高師大蔡孟芳教授", "place": "服二和", "people": 7.0, "cid": "", "codes": [], "semester": "114-1", "source": "114-1!第49列", "note": "", "time_span": "8:00-9:00", "category": "公開授課與觀議課", "audience": "教師", "theme": "閱讀、文學與人文素養", "speaker_full": "國文科黃一軒、高師大蔡孟芳教授", "web_status": "原表無課程代碼，未查網頁；講師背景保留原表內容", "url": "", "endDate": "2025-11-21", "notes": "", "intro": "", "hours": "", "countLabel": "參與人數", "id": "event-178"}, {"date": "2025-11-25T12:00:00", "type": "教師共備與分享", "time": "114年11月25日(二)12:00-13:30", "title": "專題與數位運用：差異化指導如何進行", "speaker": "三民家商特教科施品禎", "place": "人文數位學習空間", "people": 27.0, "cid": "5288918", "codes": ["5288918"], "semester": "114-1", "source": "114-1!第15列", "note": "", "time_span": "12:00-13:30", "category": "社群共備與教學分享", "audience": "教師", "theme": "自主學習與專題探究", "speaker_full": "三民家商特教科施品禎\n進修網師資（同課程）：[中小幼師]特教科施品禎", "web_status": "5288918：已讀取", "url": "https://www3.inservice.edu.t const DATA=window.ACTIVITIES,main=document.querySelector('main');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
function isoToday(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());let o=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${o.year}-${o.month}-${o.day}`}
const dateText=r=>{const d=r.date.slice(0,10).split('-').map(Number);const day='日一二三四五六'[new Date(r.date.slice(0,10)+'T12:00:00Z').getUTCDay()];let t=`${d[0]-1911}年${d[1]}月${d[2]}日（${day}）`;if(r.endDate!==r.date.slice(0,10)){const e=r.endDate.split('-').map(Number);t+=`至${e[0]-1911}年${e[1]}月${e[2]}日`;}return t};
const status=r=>r.date.slice(0,10)>isoToday()?'即將辦理':r.endDate<isoToday()?'日期已過':'今日活動';
const illustrations={'專題講座':'lecture','實作工作坊':'workshop','社群共備與教學分享':'collaboration','公開授課與觀議課':'classroom','成果發表與交流':'showcase','走讀參訪與體驗':'fieldtrip','諮詢與輔導':'consultation','教育訓練與利用教育':'training'};
const imageFor=r=>ASSET_DATA[illustrations[r.category]||'lecture'];
const unique=k=>[...new Set(DATA.map(x=>x[k]))].sort();
function card(r){return `<article class="card"><a class="card-visual" href="#event/${r.id}" tabindex="-1" aria-hidden="true"><img src="${imageFor(r)}" alt="" loading="lazy" width="640" height="300"></a><div class="card-top"><div><div class="date-year">${r.date.slice(0,4)} / ${esc(r.semester)}學期</div><div class="date-day">${r.date.slice(5,10).replace('-',' / ')}${r.endDate!==r.date.slice(0,10)?' — '+r.endDate.slice(8):''}</div></div><span class="badge ${status(r)==='即將辦理'?'upcoming':''}">${status(r)}</span></div><div class="card-body"><span class="label">${esc(r.category)}</span><h3><a href="#event/${r.id}">${esc(r.title)}</a></h3><div class="meta">◷ ${esc(r.time_span)}${r.endDate!==r.date.slice(0,10)?'（每日時段依原表）':''}</div><div class="meta">講師｜${esc(r.speaker)}</div><div class="meta">地點｜${esc(r.place||'未載明')}</div></div><a href="#event/${r.id}" class="card-bottom"><span>${esc(r.theme)}</span><span aria-label="查看活動">↗</span></a></article>`}
function stats(rows=DATA){return `<div class="stats"><div class="stat"><strong>${rows.length}</strong><span>筆活動紀錄</span></div><div class="stat"><strong>${new Set(rows.flatMap(r=>r.codes)).size}</strong><span>個進修網課程代碼</span></div><div class="stat"><strong>${new Set(rows.map(r=>r.semester)).size}</strong><span>個學期的累積</span></div><div class="stat"><strong>${rows.filter(r=>r.semester==='115-1').length}</strong><span>筆本學期活動</span></div></div>`}
function categoryGallery(){return `<section class="section category-section"><div class="section-head"><div><div class="eyebrow">FIND YOUR WAY TO LEARN</div><h2>用喜歡的方式，一起成長</h2><p>八種活動樣貌，開啟不同的共學可能。</p></div></div><div class="category-gallery">${Object.entries(illustrations).map(([category,file])=>`<a class="category-tile" href="#activities?category=${encodeURIComponent(category)}"><img src="${ASSET_DATA[file]}" alt="" loading="lazy" width="640" height="300"><div><b>${esc(category)}</b><span>${DATA.filter(r=>r.category===category).length} 筆活動 ↗</span></div></a>`).join('')}</div></section>`}
function home(){main.innerHTML=`<section class="hero"><div><div class="eyebrow">SMVS LIBRARY · GROWING TOGETHER</div><h1>讓每一次共學，<br>成為教學的<em>養分。</em></h1><p>從閱讀的深度，到數位的可能。<br>在三民家商，我們一起探索、交流，<br>記錄每一段讓教育向前的日常。</p><div class="actions"><a class="button" href="#activities">探索研習活動 <span>↗</span></a><a class="text-link" href="#insights">看見共學的軌跡</a></div></div><div class="art" role="img" aria-label="象徵閱讀與共學的書本插畫"><div class="art-circle"></div><div class="art-line">閱讀・對話・實踐</div><div class="book"><b>共學<br>日常</b><small>READ · REFLECT · CREATE</small></div><div class="book two"><b>教學<br>新可能</b><small>SMVS LIBRARY</small></div><div class="art-caption">一頁閱讀，一步成長。</div></div></section>${stats()}<section class="section"><div class="section-head"><div><div class="eyebrow">THIS SEMESTER / 115–1</div><h2>本學期，一起學些什麼？</h2><p>閱讀、SEL與AI，讓教學持續生長。</p></div><a class="text-link" href="#activities?semester=115-1">本學期全部活動 ↗</a></div><div class="tabs"><button class="chip selected" data-home="upcoming">即將辦理</button><button class="chip" data-home="recent">近期紀錄</button></div><div id="home-cards" class="cards" style="margin-top:24px"></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">EXPLORE BY INTEREST</div><h2>循著好奇，找到下一站</h2></div></div><div class="topics">${[['閱讀、文學與人文素養','閱讀與人文','01'],['AI與數位教學應用','AI與數位教學','02'],['課程設計與教學實踐','課程與教學','03'],['環境、藝術與社會情緒學習','感受與連結','04']].map(([key,t,n])=>`<a class="topic" href="#activities?theme=${encodeURIComponent(key)}"><span>${n} / LEARNING PATH</span><b>${t} ↗</b><span>${DATA.filter(r=>r.theme===key).length} 筆相關紀錄</span></a>`).join('')}</div></section>${categoryGallery()}`;function fill(type){let r=DATA.filter(r=>r.semester==='115-1'&&(type==='upcoming'?status(r)==='即將辦理':status(r)!=='即將辦理'));r.sort((a,b)=>type==='upcoming'?a.date.localeCompare(b.date):b.date.localeCompare(a.date));document.querySelector('#home-cards').innerHTML=r.slice(0,3).map(card).join('')||'<p>目前沒有符合條件的活動。</p>';document.querySelectorAll('[data-home]').forEach(b=>b.classList.toggle('selected',b.dataset.home===type));}document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>fill(b.dataset.home));fill('upcoming')}
let state={q:'',semester:'',category:'',theme:'',audience:'',start:'',end:'',sort:'desc',view:innerWidth<700?'cards':'table',page:1};
function filtered(){let a=DATA.filter(r=>(!state.q||[r.title,r.speaker_full,r.place,r.cid,r.intro].some(v=>String(v).toLowerCase().includes(state.q.toLowerCase())))&&['semester','category','theme','audience'].every(k=>!state[k]||r[k]===state[k])&&(!state.start||r.endDate>=state.start)&&(!state.end||r.date.slice(0,10)<=state.end));return a.sort((a,b)=>state.sort==='asc'?a.date.localeCompare(b.date):b.date.localeCompare(a.date))}
function select(k,label){return `<label>${label}<select id="f-${k}"><option value="">全部${label}</option>${unique(k).reverse().map(v=>`<option value="${esc(v)}" ${state[k]===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function activities(params){if(params){['semester','theme','category'].forEach(k=>state[k]=params.get(k)||'');state.page=1;}main.innerHTML=`<div class="page-heading"><div class="eyebrow">THE LEARNING ARCHIVE</div><h1>每一次交流，都值得留下。</h1><p>搜尋研習、走進課堂，也找到與自己同行的教學靈感。</p></div><div class="filters"><div class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="搜尋活動" placeholder="搜尋活動、講師、服務單位或課程代碼…" value="${esc(state.q)}"><button class="chip" id="clear">清除篩選</button></div><div class="filter-grid">${select('semester','學期')}${select('category','活動類型')}${select('theme','主題分類')}${select('audience','參與對象')}</div><div class="date-filter"><label>開始日期<input type="date" id="f-start" value="${state.start}"></label><label>結束日期<input type="date" id="f-end" value="${state.end}"></label></div></div><div class="toolbar"><div id="result-count" aria-live="polite"></div><div class="tools"><select id="sort" aria-label="活動排序"><option value="desc">日期由新到舊</option><option value="asc">日期由舊到新</option></select><button id="table-view">表格</button><button id="card-view">卡片</button><button id="export">匯出結果 CSV ↓</button></div></div><div id="results"></div><div id="pagination" class="pagination"></div>`;document.querySelector('#sort').value=state.sort;document.querySelector('#search').oninput=e=>{state.q=e.target.value;state.page=1;renderResults()};['semester','category','theme','audience','start','end'].forEach(k=>document.querySelector('#f-'+k).onchange=e=>{state[k]=e.target.value;state.page=1;renderResults()});document.querySelector('#sort').onchange=e=>{state.sort=e.target.value;renderResults()};document.querySelector('#clear').onclick=()=>{state={...state,q:'',semester:'',category:'',theme:'',audience:'',start:'',end:'',page:1};activities()};document.querySelector('#table-view').onclick=()=>{state.view='table';renderResults()};document.querySelector('#card-view').onclick=()=>{state.view='cards';renderResults()};document.querySelector('#export').onclick=exportCSV;renderResults()}
function renderResults(){let rows=filtered(),size=12,pages=Math.max(1,Math.ceil(rows.length/size));state.page=Math.min(state.page,pages);let slice=rows.slice((state.page-1)*size,state.page*size);document.querySelector('#result-count').innerHTML=`共 <b>${rows.length}</b> 筆活動 <small>／ 全部249筆</small>`;document.querySelector('#table-view').classList.toggle('selected',state.view==='table');document.querySelector('#card-view').classList.toggle('selected',state.view==='cards');document.querySelector('#results').innerHTML=!rows.length?'<div class="empty"><h3>沒有符合條件的活動</h3><p>試著減少篩選條件，或換一個關鍵字。</p></div>':state.view==='cards'?`<div class="cards">${slice.map(card).join('')}</div>`:`<div class="table-wrap"><table><thead><tr><th>辦理日期／時段</th><th>活動名稱與類型</th><th>講師與背景</th><th>地點</th><th>人數</th><th>進修網</th></tr></thead><tbody>${slice.map(r=>`<tr><td style="min-width:160px">${esc(dateText(r))}<br><small>${esc(r.time_span)}</small><br><span class="badge ${status(r)==='即將辦理'?'upcoming':''}">${status(r)}</span></td><td style="min-width:260px;max-width:350px"><img class="table-visual" src="${imageFor(r)}" alt="" loading="lazy" width="104" height="62"><span class="label">${esc(r.category)}</span><br><a href="#event/${r.id}">${esc(r.title)}</a><br><small>${esc(r.theme)}</small></td><td style="min-width:200px;max-width:260px">${esc(r.speaker)}<br><a class="read-more" href="#event/${r.id}">完整講師背景 ↗</a></td><td style="min-width:100px">${esc(r.place||'未載明')}</td><td>${r.people??'未提供'}${r.people!==null&&r.countLabel==='原表登錄人數'?'<br><small>原表登錄</small>':''}</td><td>${r.codes.length?r.codes.map(c=>`<a href="https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=${c}" target="_blank" rel="noopener">${c} ↗</a>`).join('<br>'):'—'}</td></tr>`).join('')}</tbody></table></div>`;document.querySelector('#pagination').innerHTML=`<button id="prev" ${state.page===1?'disabled':''}>← 上一頁</button><span>${state.page} / ${pages}</span><button id="next" ${state.page===pages?'disabled':''}>下一頁 →</button>`;document.querySelector('#prev').onclick=()=>{state.page--;renderResults()};document.querySelector('#next').onclick=()=>{state.page++;renderResults();document.querySelector('.toolbar').scrollIntoView({block:'start',behavior:'smooth'})}}
function exportCSV(){let headers=['辦理日期','辦理時間','活動類型','研習主題分類','參與對象','活動名稱','講師完整背景','地點','人數','人數性質','課程代碼','學期','備註'];let arr=filtered().map(r=>[dateText(r),r.time_span,r.category,r.theme,r.audience,r.title,r.speaker_full,r.place,r.people??'',r.countLabel,r.cid,r.semester,r.notes]);let quote=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';let blob=new Blob(['\ufeff'+[headers,...arr].map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='三民家商圖書館_研習查詢結果.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function detail(id){let r=DATA.find(r=>r.id===id);if(!r){main.innerHTML='<div class="empty">找不到此活動。<a href="#activities">返回總覽</a></div>';return}let related=DATA.filter(x=>x.id!==r.id&&x.codes.some(c=>r.codes.includes(c)));main.innerHTML=`<article class="detail"><a class="back" href="#activities">← 返回研習活動</a><img class="detail-visual" src="${imageFor(r)}" alt="${esc(r.category)}主題插圖" width="640" height="300"><div style="margin-top:28px" class="eyebrow">${r.semester} SEMESTER / LEARNING RECORD</div><h1>${esc(r.title)}</h1><div class="detail-tags"><span class="badge">${esc(r.category)}</span><span class="badge">${esc(r.theme)}</span><span class="badge upcoming">${status(r)}</span></div><dl class="detail-grid"><div><dt>辦理日期</dt><dd>${esc(dateText(r))}</dd></div><div><dt>完整辦理時段</dt><dd>${esc(r.time_span)}${r.endDate!==r.date.slice(0,10)?'（每日時段依原表）':''}</dd></div><div><dt>辦理地點</dt><dd>${esc(r.place||'未載明')}</dd></div><div><dt>參與對象</dt><dd>${esc(r.audience)}</dd></div><div><dt>${esc(r.countLabel)}</dt><dd>${r.people===null?'未提供':r.people+' 人'}</dd></div></dl>${r.notes?`<div class="note">資料備註｜${esc(r.notes)}</div>`:''}<section class="detail-section"><h2>講師與背景</h2><div class="pre">${esc(r.speaker_full)}</div>${r.speaker_full.includes('同課程')?'<p style="font-size:12px">進修網師資以整個課程登錄；各時段授課者仍以原表紀錄為準。</p>':''}</section>${r.intro?`<section class="detail-section"><h2>課程內容</h2><div class="pre">${esc(r.intro)}</div></section>`:''}<section class="detail-section"><h2>課程連結與資料來源</h2><div class="course-links">${r.codes.map(c=>`<a class="button secondary" target="_blank" rel="noopener" href="https://www3.inservice.edu.tw/NAPP/CourseView.aspx?cid=${c}">進修網 ${c} ↗</a>`).join('')||'<p>原表未提供課程代碼。</p>'}</div><details><summary>查看原始時間與資料說明</summary><p class="pre">原表時間：${esc(r.time)}\n來源：${esc(r.source)}\n${r.semester==='115-1'?'本學期資料依上傳表格及使用者更正整理；尚未逐筆讀取課程頁。':esc(r.web_status)}</p></details></section>${related.length?`<section class="detail-section"><h2>同課程相關場次</h2>${related.map(x=>`<p><a class="text-link" href="#event/${x.id}">${esc(x.time_span)} · ${esc(x.title)} ↗</a></p>`).join('')}</section>`:''}</article>`}
function bars(key){let keys=unique(key);let values=keys.map(k=>DATA.filter(r=>r[key]===k).length),max=Math.max(...values);return keys.map((k,i)=>`<div class="chart-row"><span>${esc(k)}</span><div class="bar-track"><div class="bar" style="width:${values[i]/max*100}%"></div></div><b>${values[i]}</b></div>`).join('')}
function insights(){main.innerHTML=`<div class="page-heading"><div class="eyebrow">OUR SHARED JOURNEY</div><h1>把共學，累積成看得見的軌跡。</h1><p>從111學年度第2學期至115學年度第1學期，持續記錄教學的探索與實踐。</p></div>${stats()}<div class="note">以下統計為「活動紀錄筆數」，含同一課程的不同時段；不等同於不同課程數。未直接加總參與人數，以免重複計入。</div><div class="insight-grid"><section class="section"><div class="eyebrow">BY SEMESTER</div><h2>每學期的共學足跡</h2>${bars('semester')}</section><section class="section"><div class="eyebrow">WAYS WE LEARN</div><h2>多元的學習樣貌</h2>${bars('category')}</section></div><section class="section"><div class="section-head"><div><div class="eyebrow">THEMES IN PRACTICE</div><h2>讓專業，長出更多可能</h2></div></div><div class="topics">${unique('theme').map(t=>`<a class="topic" href="#activities?theme=${encodeURIComponent(t)}"><span>LEARNING THEME</span><b style="font-size:18px">${esc(t)}</b><span>${DATA.filter(r=>r.theme===t).length} 筆活動 ↗</span></a>`).join('')}</div></section>`}
function about(){main.innerHTML=`<div class="about"><div class="page-heading"><div class="eyebrow">ABOUT THIS ARCHIVE</div><h1>記錄教學，也記錄一起成長的人。</h1><p>三民家商圖書館・研習與教學成長紀錄</p></div><h2>閱讀，連結教學的更多可能</h2><p>這裡整理圖書館相關研習、教師共備、公開觀議課、走讀參訪與學生培訓，讓每一次專業交流，都能成為下一次課程設計的起點。</p><h2>資料範圍與來源</h2><ul><li>歷年總表219筆、本學期新增30筆，共249筆活動紀錄。</li><li>涵蓋112年3月至116年1月；學期標示依原表保留。</li><li>歷年資料已讀取140個不重複進修網課程頁面，補入登錄師資與課程簡介。查核日期：115年10月17日。</li><li>115-1依本學期活動表整理；8/28星期、11/18時段、12/2時段與地點依使用者更正，B5-2暫不列入。</li></ul><h2>分類與狀態怎麼看？</h2><p>活動依「活動類型」「研習主題」「參與對象」三個維度分類。分類依內容判讀；「其他／待確認」代表原表未能明確辨別參與對象。</p><p>網站以臺灣日期區分「即將辦理」「今日活動」與「日期已過」。日期已過不代表已查證活動確實完成；活動異動仍以承辦單位最新資訊為準。</p><h2>人數與課程統計原則</h2><ul><li>同一課程代碼的不同時段各自保留，活動筆數與課程代碼數分別計算。</li><li>人數未填顯示「未提供」，不當作零人。</li><li>本學期尚未辦理活動所填人數，標示為「原表登錄人數」，不視為實到人數。</li><li>同課程多時段的人數可能重複，因此網站不將全部人數直接加總。</li></ul><h2>完整資訊與待確認紀錄</h2><p>日期依年月日排列，保留完整原始時間。原表星期與日期不同的紀錄會加註；講師單位、職稱依活動當時來源呈現。網頁師資可能涵蓋同課程多個時段，不自動視為各時段的全部授課者。</p><p>歷年有1筆活動未載明時段，及部分日期差異，已保留備註；本學期11/20活動的詳細教室仍待確認。</p><a class="button" href="#activities">開始探索活動 ↗</a></div>`}
function route(){let raw=appHash.slice(1)||'home',[path,query]=raw.split('?');document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+(path.startsWith('event/')?'activities':path)));if(path==='home')home();else if(path==='activities')activities(query?new URLSearchParams(query):null);else if(path==='insights')insights();else if(path.startsWith('event/'))detail(path.split('/')[1]);else about();window.scrollTo(0,0);document.title=(path.startsWith('event/')?(DATA.find(r=>r.id===path.split('/')[1])?.title||'活動'):({'home':'共學日常','activities':'研習活動','insights':'歷年成果','about':'關於紀錄'}[path]||'共學日常'))+'｜三民家商圖書館'}
document.addEventListener('click',event=>{const a=event.target.closest('a[href^="#"]');if(!a)return;event.preventDefault();appHash=a.getAttribute('href');route();});route();
</script></body></html>
